[package]
name = "pii_rules_native"
version = "1.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
aho-corasick = "1"
pcre2 = "0.2"
# For pcre2_config, which the safe wrapper does not expose.
pcre2-sys = "0.2"
# abi3: one build loads on every CPython from 3.9 on, so a host needs one file
# per OS and CPU, not one per Python version.
pyo3 = { version = "0.25", features = ["extension-module", "abi3-py39"] }

[profile.release]
codegen-units = 1
lto = true
