name: ci

# The offline suites only. pii_opf and pii_redact_torch need torch and onnxruntime,
# so they are not run here; every other suite is hermetic and needs no model.
#
# coverage.sh is the single entry point: it runs that same set of suites and
# enforces PII_COV_FLOOR per file, so a developer and CI run one identical
# command rather than two lists that drift apart.

on:
  pull_request:
  push:
    branches: [main]
    # A version tag also publishes the native rules engine as release assets,
    # which is where install.sh downloads it from.
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install --yes jq

      # install.sh requires uv for its default mode, so the installer tests need it
      # present. Without it the installer refuses at need_cmd, which is correct
      # behaviour and makes seventeen of those tests fail for the wrong reason.
      - name: Install uv
        run: |
          curl -fsSL https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # The canary suite drives the real Claude Code CLI against a scripted API, so
      # it skips without one and reports as skipped in the suite table. Installing
      # the current release is deliberate: that suite exists to notice when the CLI
      # changes a hook contract, so pinning it would defeat it.
      - name: Install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Show the tool versions the hook depends on
        run: |
          bash --version | head -1
          python3 --version
          jq --version
          curl --version | head -1
          uv --version
          lsof -v 2>&1 | head -1
          claude --version

      - name: Offline suites and the coverage floor
        working-directory: hooks-pii
        # PII_COV_DETAIL prints the uncovered lines, so a failure here says which
        # line regressed rather than only that the floor was missed.
        run: PII_COV_FLOOR=100 PII_COV_DETAIL=1 bash tests/coverage.sh

  # The native rules engine, one build per platform install.sh knows. Each job
  # builds the module, then runs the rules suite on it: the parity tests there
  # check every corpus text against re, and skip only when no module loaded,
  # which the check before them rules out.
  native:
    strategy:
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-latest
          - platform: darwin-arm64
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # manylinux_2_28 pins the oldest glibc the module needs to 2.28, so one
      # file loads on every current distribution. The runner's own glibc would
      # pin it to whatever that runner ships.
      - name: Build on Linux
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD":/io -w /io/hooks-pii/native \
            quay.io/pypa/manylinux_2_28_x86_64 bash -c '
              curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal &&
              . "$HOME/.cargo/env" &&
              PYO3_PYTHON=/opt/python/cp39-cp39/bin/python3 cargo build --release --locked'
          sudo cp hooks-pii/native/target/release/libpii_rules_native.so hooks-pii/pii_rules_native.abi3.so

      - name: Build on macOS
        if: runner.os == 'macOS'
        working-directory: hooks-pii/native
        run: |
          cargo build --release --locked
          cp target/release/libpii_rules_native.dylib ../pii_rules_native.abi3.so

      - name: Check the module loads as the native engine
        working-directory: hooks-pii
        run: python3 -c "import pii_rules; print(pii_rules.RULES_ENGINE); assert pii_rules.RULES_ENGINE == 'native'"

      - name: Rules suite on the native engine
        working-directory: hooks-pii
        run: python3 -m unittest discover -s tests -p test_pii_rules.py

      - name: Name the file for the release
        run: cp hooks-pii/pii_rules_native.abi3.so pii_rules_native-${{ matrix.platform }}.abi3.so

      - uses: actions/upload-artifact@v4
        with:
          name: pii_rules_native-${{ matrix.platform }}
          path: pii_rules_native-${{ matrix.platform }}.abi3.so
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, native]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pii_rules_native-*
          merge-multiple: true

      - name: Attach the native builds to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes
          gh release upload "$GITHUB_REF_NAME" pii_rules_native-*.abi3.so --repo "$GITHUB_REPOSITORY" --clobber
